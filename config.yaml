# Gateway Configuration (config.yaml)
gateway:
  # Network settings
  public_host: "0.0.0.0"
  public_port: 50053
  control_host: "0.0.0.0"
  control_port: 50054
  tunnel_port_base: 60000

  # TLS configuration
  tls:
    enabled: true
    cert_path: "./certs/server.crt"
    key_path: "./certs/server.key"
    longevity_years: 5  # Certificate validity period in years

  # HTTP Certificate Server
  http_cert_server:
    enabled: true
    port: 8443
    
  # Authentication
  auth_token: "303ae51c1bfbe5f7065edf30e3c8d9f2dccefa8cad3deeaab035e4ffa0b37a3e"  # Leave empty to auto-generate, or provide a fixed token

  # Logging
  log_level: "debug"  # debug, info, warn, error